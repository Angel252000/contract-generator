[project]
name = "contract-generator"
version = "1.1.0"
description = "Generador de contratos con IA: describe, genera un borrador, edítalo y descárgalo."
readme = "README.md"
license = "MIT"
authors = [{ name = "Angel Eduardo Torrento Amaya" }]
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.1",
    "flask>=3.0",
    "python-docx>=1.1",
    "python-dotenv>=1.0",
    "waitress>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[project.scripts]
contract-generator = "contract_generator.api.cli:main"
contract-generator-web = "contract_generator.api.web:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/contract_generator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
